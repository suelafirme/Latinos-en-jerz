name: Smoke test V4 web app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'community.js'
      - 'config.js'
      - 'logo.svg'
      - '.github/workflows/smoke-web.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and source assets
        shell: bash
        run: |
          node --check app.js
          node --check community.js
          test -s logo.svg
          test -s index.html
      - name: Render with Chrome
        shell: bash
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 &
          sleep 2
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then echo "No Chrome installed"; exit 1; fi
          timeout 70s "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --virtual-time-budget=20000 --window-size=430,950 --screenshot=ui-screenshot.png http://127.0.0.1:8123/ || true
          timeout 70s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8123/ > rendered.html
          grep -q 'LATINOS EN JEREZ' rendered.html
          grep -q 'group-mini' rendered.html
          if grep -q 'Cargando grupos...' rendered.html; then echo 'Groups did not finish loading'; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LATINOS-V4-SCREENSHOT
          path: ui-screenshot.png
