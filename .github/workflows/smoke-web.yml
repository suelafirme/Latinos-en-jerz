name: Smoke test V4 web app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'community.js'
      - 'config.js'
      - 'logo.svg'
      - 'v5.js'
      - 'v5.css'
      - 'smoke-web.mjs'
      - '.github/workflows/smoke-web.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and source assets
        shell: bash
        run: |
          node --check app.js
          node --check community.js
          node --check v5.js
          test -s v5.css
          test -s logo.svg
          test -s index.html
      - name: Check Supabase browser CDN
        shell: bash
        run: |
          curl -IL --max-time 20 "https://esm.sh/@supabase/supabase-js@2.95.3" | head -16
      - name: Render and test with real-time browser waits
        shell: bash
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 &
          npm install --no-save playwright-core@1.57.0
          node smoke-web.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LATINOS-V4-SCREENSHOT
          path: |
            ui-screenshot.png
            home-live.png
            groups-live.png
            chrome-errors.log
            rendered.html
