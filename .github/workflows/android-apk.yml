name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        shell: bash
        run: |
          SDK_MANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -1)
          if [ -z "$SDK_MANAGER" ]; then echo 'SDK manager unavailable'; exit 1; fi
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name and verify APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk latinos-en-jerez-v4.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose latinos-en-jerez-v4.apk
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging latinos-en-jerez-v4.apk | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: LATINOS-EN-JEREZ-APK
          path: latinos-en-jerez-v4.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v4.0.0 >/dev/null 2>&1; then
            gh release upload v4.0.0 latinos-en-jerez-v4.apk --clobber
          else
            gh release create v4.0.0 latinos-en-jerez-v4.apk --title "LATINOS EN JEREZ — Android V4" --notes "APK de prueba para Android. Comunidad Latina en Jerez. El instalador está firmado con la clave de desarrollo y necesita conexión a Internet. Instálalo solo desde este repositorio oficial."
          fi
