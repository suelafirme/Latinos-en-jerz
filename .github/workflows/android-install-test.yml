name: Verify Android APK installs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'app/build.gradle'
      - '.github/workflows/android-install-test.yml'
permissions:
  contents: read
jobs:
  install-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up SDK
        run: |
          SDK_MANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build and inspect APK
        run: |
          gradle --no-daemon :app:assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -8
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep "com.latinosenjerez.comunidad"
            adb shell am start -n com.latinosenjerez.comunidad/com.latinosenjerez.app.MainActivity
            sleep 12
            adb shell dumpsys activity activities | grep -i "latinosenjerez" | head -8
            adb logcat -d -t 800 | grep -E "FATAL EXCEPTION|com.latinosenjerez.comunidad" | tail -25 || true
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ANDROID-EMULATOR-VERIFIED-APK
          path: app/build/outputs/apk/debug/app-debug.apk
