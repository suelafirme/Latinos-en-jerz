plugins { id 'com.android.application' }
android {
    namespace 'com.latinosenjerez.app'
    compileSdk 35
    defaultConfig {
        applicationId "com.latinosenjerez.comunidad"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "5.1"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
